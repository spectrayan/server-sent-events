name: Release NPM Packages

on:
  push:
    tags:
      - 'ng-sse-client-v*'
      - 'sse-client-v*'
      - 'react-sse-v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to release'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - sse-client
          - react-sse
          - ng-sse-client
      dryRun:
        description: 'Dry run — build and package only (do not publish to registry)'
        required: false
        default: false
        type: boolean
      version:
        description: 'Override version (e.g. 2.0.0). Leave empty to use tag or package.json'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

env:
  NX_DAEMON: 'false'

jobs:
  publish-npm:
    name: Build & Publish NPM Packages
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Publish NPM Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARGET_PKG: ${{ github.event.inputs.package || 'all' }}
          OVERRIDE_VER: ${{ github.event.inputs.version || '' }}
          DRY_RUN: ${{ github.event.inputs.dryRun || 'false' }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "Error: NPM_TOKEN secret is not configured." >&2
            exit 1
          fi

          EXTRA_FLAGS=""
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi

          if [ "${{ github.event_name }}" = "push" ]; then
            if [[ "$GITHUB_REF_NAME" =~ ^ng-sse-client-v[0-9] ]]; then
              TARGET_PKG="ng-sse-client"
              OVERRIDE_VER="${GITHUB_REF_NAME#ng-sse-client-v}"
            elif [[ "$GITHUB_REF_NAME" =~ ^sse-client-v[0-9] ]]; then
              TARGET_PKG="sse-client"
              OVERRIDE_VER="${GITHUB_REF_NAME#sse-client-v}"
            elif [[ "$GITHUB_REF_NAME" =~ ^react-sse-v[0-9] ]]; then
              TARGET_PKG="react-sse"
              OVERRIDE_VER="${GITHUB_REF_NAME#react-sse-v}"
            elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
              TARGET_PKG="all"
              OVERRIDE_VER="${GITHUB_REF_NAME#v}"
            fi
          fi

          echo "Target package: $TARGET_PKG"
          echo "Override version: $OVERRIDE_VER"
          echo "Dry run: $DRY_RUN"

          publish_package() {
            local PKG_NAME=$1
            local PKG_DIR=$2
            local DIST_DIR=$3
            local BUILD_CMD=$4
            local TEST_CMD=$5

            echo "=========================================="
            echo "Processing $PKG_NAME..."
            echo "=========================================="

            if [ -n "$OVERRIDE_VER" ]; then
              npm --prefix "$PKG_DIR" version "$OVERRIDE_VER" --no-git-tag-version --allow-same-version
            fi

            echo "Running tests: $TEST_CMD"
            eval "$TEST_CMD"

            echo "Building: $BUILD_CMD"
            eval "$BUILD_CMD"

            CURRENT_VER=$(node -p "require('./$PKG_DIR/package.json').version")
            if [ "$DRY_RUN" != "true" ] && npm view "$PKG_NAME@$CURRENT_VER" version >/dev/null 2>&1; then
              echo "⏭️ Version $CURRENT_VER of $PKG_NAME is already published on npm. Skipping publish."
            else
              echo "🚀 Publishing $PKG_NAME@$CURRENT_VER to NPM..."
              cd "$DIST_DIR"
              npm publish --access public $EXTRA_FLAGS
              cd - >/dev/null
            fi
          }

          if [ "$TARGET_PKG" = "all" ] || [ "$TARGET_PKG" = "sse-client" ]; then
            publish_package "@spectrayan/sse-client" "libs/sse-client" "libs/sse-client" "npm run build:sse-client" "npm run test:sse-client"
          fi

          if [ "$TARGET_PKG" = "all" ] || [ "$TARGET_PKG" = "react-sse" ]; then
            publish_package "@spectrayan/react-sse" "libs/react-sse" "libs/react-sse" "npm run build:react-sse" "npm run test:react-sse"
          fi

          if [ "$TARGET_PKG" = "all" ] || [ "$TARGET_PKG" = "ng-sse-client" ]; then
            publish_package "@spectrayan/ng-sse-client" "libs/ng-sse-client" "dist/libs/ng-sse-client" "npx nx build ng-sse-client" "npx nx test ng-sse-client"
          fi

          echo "✅ NPM release pipeline completed successfully."
