name: Auto-Tag & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - 'libs/ng-sse-client/package.json'
      - 'libs/sse-client/package.json'
      - 'libs/react-sse/package.json'

permissions:
  contents: write

jobs:
  tag-and-release:
    name: Detect version changes & create releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2  # need previous commit to detect changes

      # ── Detect Maven version change ──────────────────────────────
      - name: Get current Maven version
        id: maven_current
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Maven current version: $VERSION"

      - name: Get previous Maven version
        id: maven_previous
        run: |
          VERSION=$(git show HEAD~1:pom.xml 2>/dev/null | grep -m1 '<version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/' || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Maven previous version: $VERSION"

      - name: Check if Maven version changed
        id: maven_changed
        run: |
          if [ "${{ steps.maven_current.outputs.version }}" != "${{ steps.maven_previous.outputs.version }}" ] && \
             [ -n "${{ steps.maven_current.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Maven version changed: ${{ steps.maven_previous.outputs.version }} → ${{ steps.maven_current.outputs.version }}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ Maven version unchanged"
          fi

      # ── Detect ng-sse-client version change ────────────────────────
      - name: Get current ng-sse-client version
        id: ng_current
        run: |
          VERSION=$(node -p "require('./libs/ng-sse-client/package.json').version" 2>/dev/null || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ng-sse-client current version: $VERSION"

      - name: Get previous ng-sse-client version
        id: ng_previous
        run: |
          VERSION=$(git show HEAD~1:libs/ng-sse-client/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ng-sse-client previous version: $VERSION"

      - name: Check if ng-sse-client version changed
        id: ng_changed
        run: |
          if [ "${{ steps.ng_current.outputs.version }}" != "${{ steps.ng_previous.outputs.version }}" ] && \
             [ -n "${{ steps.ng_current.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ ng-sse-client version changed: ${{ steps.ng_previous.outputs.version }} → ${{ steps.ng_current.outputs.version }}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ ng-sse-client version unchanged"
          fi

      # ── Detect sse-client version change ───────────────────────────
      - name: Get current sse-client version
        id: sse_current
        run: |
          VERSION=$(node -p "require('./libs/sse-client/package.json').version" 2>/dev/null || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sse-client current version: $VERSION"

      - name: Get previous sse-client version
        id: sse_previous
        run: |
          VERSION=$(git show HEAD~1:libs/sse-client/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sse-client previous version: $VERSION"

      - name: Check if sse-client version changed
        id: sse_changed
        run: |
          if [ "${{ steps.sse_current.outputs.version }}" != "${{ steps.sse_previous.outputs.version }}" ] && \
             [ -n "${{ steps.sse_current.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ sse-client version changed: ${{ steps.sse_previous.outputs.version }} → ${{ steps.sse_current.outputs.version }}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ sse-client version unchanged"
          fi

      # ── Detect react-sse version change ────────────────────────────
      - name: Get current react-sse version
        id: react_current
        run: |
          VERSION=$(node -p "require('./libs/react-sse/package.json').version" 2>/dev/null || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "react-sse current version: $VERSION"

      - name: Get previous react-sse version
        id: react_previous
        run: |
          VERSION=$(git show HEAD~1:libs/react-sse/package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "react-sse previous version: $VERSION"

      - name: Check if react-sse version changed
        id: react_changed
        run: |
          if [ "${{ steps.react_current.outputs.version }}" != "${{ steps.react_previous.outputs.version }}" ] && \
             [ -n "${{ steps.react_current.outputs.version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "✅ react-sse version changed: ${{ steps.react_previous.outputs.version }} → ${{ steps.react_current.outputs.version }}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "⏭️ react-sse version unchanged"
          fi

      # ── Create Maven release tag ──────────────────────────────────
      - name: Create Maven release tag
        if: steps.maven_changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.maven_current.outputs.version }}
          PREV_VERSION: ${{ steps.maven_previous.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "⏭️ Tag $TAG already exists on remote, skipping"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⏭️ Release $TAG already exists, skipping"
            exit 0
          fi
          PRERELEASE=""
          if echo "$VERSION" | grep -qiE '(SNAPSHOT|M[0-9]+|RC[0-9]+|alpha|beta)'; then
            PRERELEASE="--prerelease"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "🚀 Server Libraries $TAG" \
            --generate-notes \
            --notes-start-tag "v${PREV_VERSION}" \
            $PRERELEASE
          echo "✅ Created release: $TAG"

      # ── Create ng-sse-client release tag ───────────────────────────
      - name: Create ng-sse-client release tag
        if: steps.ng_changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ng_current.outputs.version }}
          PREV_VERSION: ${{ steps.ng_previous.outputs.version }}
        run: |
          TAG="ng-sse-client-v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "⏭️ Tag $TAG already exists on remote, skipping"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⏭️ Release $TAG already exists, skipping"
            exit 0
          fi
          PRERELEASE=""
          if echo "$VERSION" | grep -qiE '(alpha|beta|rc|next)'; then
            PRERELEASE="--prerelease"
          fi
          git tag -a "$TAG" -m "Release @spectrayan/ng-sse-client $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "📱 @spectrayan/ng-sse-client $VERSION" \
            --generate-notes \
            --notes-start-tag "ng-sse-client-v${PREV_VERSION}" \
            $PRERELEASE
          echo "✅ Created release: $TAG"

      # ── Create sse-client release tag ──────────────────────────────
      - name: Create sse-client release tag
        if: steps.sse_changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sse_current.outputs.version }}
          PREV_VERSION: ${{ steps.sse_previous.outputs.version }}
        run: |
          TAG="sse-client-v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "⏭️ Tag $TAG already exists on remote, skipping"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⏭️ Release $TAG already exists, skipping"
            exit 0
          fi
          PRERELEASE=""
          if echo "$VERSION" | grep -qiE '(alpha|beta|rc|next)'; then
            PRERELEASE="--prerelease"
          fi
          git tag -a "$TAG" -m "Release @spectrayan/sse-client $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "📦 @spectrayan/sse-client $VERSION" \
            --generate-notes \
            --notes-start-tag "sse-client-v${PREV_VERSION}" \
            $PRERELEASE
          echo "✅ Created release: $TAG"

      # ── Create react-sse release tag ───────────────────────────────
      - name: Create react-sse release tag
        if: steps.react_changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.react_current.outputs.version }}
          PREV_VERSION: ${{ steps.react_previous.outputs.version }}
        run: |
          TAG="react-sse-v${VERSION}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "⏭️ Tag $TAG already exists on remote, skipping"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⏭️ Release $TAG already exists, skipping"
            exit 0
          fi
          PRERELEASE=""
          if echo "$VERSION" | grep -qiE '(alpha|beta|rc|next)'; then
            PRERELEASE="--prerelease"
          fi
          git tag -a "$TAG" -m "Release @spectrayan/react-sse $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "⚛️ @spectrayan/react-sse $VERSION" \
            --generate-notes \
            --notes-start-tag "react-sse-v${PREV_VERSION}" \
            $PRERELEASE
          echo "✅ Created release: $TAG"

      # ── Summary ──────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## 🏷️ Auto-Tag Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | Previous | Current | Tagged? |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---------|----------|---------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Server (Maven)** | \`${{ steps.maven_previous.outputs.version }}\` | \`${{ steps.maven_current.outputs.version }}\` | ${{ steps.maven_changed.outputs.changed == 'true' && '✅ Yes' || '⏭️ No' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **@spectrayan/ng-sse-client** | \`${{ steps.ng_previous.outputs.version }}\` | \`${{ steps.ng_current.outputs.version }}\` | ${{ steps.ng_changed.outputs.changed == 'true' && '✅ Yes' || '⏭️ No' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **@spectrayan/sse-client** | \`${{ steps.sse_previous.outputs.version }}\` | \`${{ steps.sse_current.outputs.version }}\` | ${{ steps.sse_changed.outputs.changed == 'true' && '✅ Yes' || '⏭️ No' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **@spectrayan/react-sse** | \`${{ steps.react_previous.outputs.version }}\` | \`${{ steps.react_current.outputs.version }}\` | ${{ steps.react_changed.outputs.changed == 'true' && '✅ Yes' || '⏭️ No' }} |" >> "$GITHUB_STEP_SUMMARY"
