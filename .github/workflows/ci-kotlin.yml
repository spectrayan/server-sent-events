name: Kotlin Client CI

on:
  push:
    branches: [ main ]
    paths:
      - 'clients/kotlin/**'
      - '.github/workflows/ci-kotlin.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'clients/kotlin/**'
      - '.github/workflows/ci-kotlin.yml'

permissions:
  contents: read

jobs:
  test:
    name: Kotlin Test (Java ${{ matrix.java-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17', '21']
    defaults:
      run:
        working-directory: clients/kotlin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test --info
