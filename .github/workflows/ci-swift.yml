name: Swift Client CI

on:
  push:
    branches: [ main ]
    paths:
      - 'clients/swift/**'
      - '.github/workflows/ci-swift.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'clients/swift/**'
      - '.github/workflows/ci-swift.yml'

permissions:
  contents: read

jobs:
  test:
    name: Swift Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    defaults:
      run:
        working-directory: clients/swift

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build Package
        run: swift build -c release

      - name: Run Tests
        run: swift test
