[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectrayan-sse-client"
version = "2.0.0"
description = "Modern, resilient asynchronous Server-Sent Events (SSE) client for Python with httpx, Pydantic V2 models, auto-reconnection, and exponential backoff."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Spectrayan Maintainers", email = "dev@spectrayan.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/spectrayan/server-sent-events"
Repository = "https://github.com/spectrayan/server-sent-events"
Documentation = "https://github.com/spectrayan/server-sent-events/tree/main/clients/python/spectrayan-sse-client#readme"
Issues = "https://github.com/spectrayan/server-sent-events/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectrayan_sse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]